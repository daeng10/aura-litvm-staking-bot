name: AURA Staking 1 Minute

on:
  workflow_dispatch:

concurrency:
  group: aura-staking
  cancel-in-progress: false

jobs:
  staking:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run AURA staking every 60 seconds
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          while true
          do
            echo "========================================"
            echo "Starting AURA staking attempt"
            echo "Time: $(date -u)"
            echo "========================================"

            node bot.js

            STATUS=$?

            echo ""
            echo "Bot selesai dengan exit code: $STATUS"
            echo "Menunggu 60 detik..."
            sleep 60
          done
